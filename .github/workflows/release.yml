name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for NPM Provenance (OIDC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.21.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: npx changeset publish
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          create-github-releases: true
        env:
          # npm trusted publishing (OIDC) — no NPM_TOKEN needed with changesets/action v2.
          NPM_CONFIG_PROVENANCE: true

      - name: Push SemVer Tags for GitHub Actions
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./packages/vue-doctor/package.json').version")
          MAJOR=$(node -p "require('./packages/vue-doctor/package.json').version.split('.')[0]")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force update the major vX tag (e.g. v1) to point to this release
          git tag -fa "v$MAJOR" -m "Release v$VERSION"
          git push origin "v$MAJOR" --force

          # The exact version tag (e.g. v2.0.1) is immutable: never force-move it.
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
